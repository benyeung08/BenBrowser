name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 校验
  verify:
    name: analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 建议版本稳定后锁定，例如：flutter-version: '3.35.1'
      - name: 安装依赖
        run: flutter pub get
      - name: 静态检查
        # 只分析 lib 与 test，避免各平台原生壳目录干扰结果。
        # tee 保留完整日志方便排查；pipefail 确保 analyze 的失败码不被 tee 吃掉
        run: |
          set -o pipefail
          flutter analyze lib test --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
      - name: 上传 analyze 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log
          path: analyze.log
      - name: 单元测试
        run: flutter test

  # ---------------------------------------------------------------- Android
  android:
    name: android
    needs: verify
    # 开关：改成 `if: false` 即可单独跳过这个平台，不用删整段 job。
    # 注意：这里不能写 env.XXX —— GitHub Actions 的 job 级 if 不支持
    # env context，写了会让整个 workflow 文件失效、所有 job 都不执行。
    if: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # 目标 Android 17（API 37）。先尽力装上 platforms;android-37；
      # runner 若确实提供不了，就用其最高可用版本继续构建并打出醒目警告。
      # 直接 exit 1 会让整条流水线挂掉、一个包都出不来，那没有意义——
      # 降级只影响 targetSdk，minSdk 29 与全部功能都不受影响。
      - name: 准备 Android SDK（目标 37 / Android 17）
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # 旧版 cmdline-tools 看不到新包，先自我更新
          "$SDKMGR" --update 2>&1 | tail -3 || true
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-37" 2>&1 | tail -5 || true
          # 刻意不安装 build-tools：版本随 AGP 要求自动准备，
          # 手动指定 37.0.0 若装一半失败会留下损坏目录，反而让构建报
          # "Installed Build Tools is corrupted"。交给 AGP 自己下载最稳。

          echo "runner 已安装的 platform："
          ls "$ANDROID_HOME/platforms" || true

          # 不能只看目录名在不在：sdkmanager 装到一半失败也会留下空目录，
          # 那样 gradle 会报一堆莫名其妙的错。必须确认 android.jar 真的存在。
          AVAIL=""
          for d in "$ANDROID_HOME"/platforms/android-*; do
            [ -f "$d/android.jar" ] || continue
            n=$(basename "$d" | cut -d- -f2)
            if [ -z "$AVAIL" ] || [ "$n" -gt "$AVAIL" ]; then AVAIL=$n; fi
          done
          echo "检测到可用的最高完整 SDK：${AVAIL:-未检测到}"

          if [ -n "$AVAIL" ] && [ "$AVAIL" -ge 37 ]; then
            echo "ANDROID_COMPILE_SDK=37" >> "$GITHUB_ENV"
            echo "ANDROID_TARGET_SDK=37" >> "$GITHUB_ENV"
            echo "::notice::以 Android 17（API 37）为目标构建"
          elif [ -n "$AVAIL" ]; then
            echo "ANDROID_COMPILE_SDK=$AVAIL" >> "$GITHUB_ENV"
            echo "ANDROID_TARGET_SDK=$AVAIL" >> "$GITHUB_ENV"
            echo "::warning::runner 无 Android SDK 37，本次以 API $AVAIL 构建"
            echo "::warning::等 runner 提供 platforms;android-37 后会自动切回 Android 17"
          else
            # 完全探测不到就别硬改，沿用 Flutter 自带变量，至少包能出来
            echo "ANDROID_KEEP_FLUTTER_SDK=true" >> "$GITHUB_ENV"
            echo "::warning::未探测到任何 platform，沿用 Flutter 默认 SDK 版本"
          fi

      # flutter create 会用模板覆盖 lib/main.dart，并生成引用 MyApp 的
      # test/widget_test.dart，两者都会让打包结果变成计数器 demo，必须还原
      # 先打印环境，构建出问题时可以直接对照版本
      - name: 打印环境
        run: |
          flutter --version
          java -version 2>&1 | head -1
          echo "ANDROID_HOME=$ANDROID_HOME"

      # flutter create 会用模板覆盖 lib/main.dart，并生成引用 MyApp 的
      # test/widget_test.dart，两者都会让打包结果变成计数器 demo，必须还原
      - name: 生成 Android 壳
        run: |
          cp lib/main.dart "$RUNNER_TEMP/main.dart.bak"
          flutter create --org com.ben --project-name ben_browser --platforms=android .
          cp "$RUNNER_TEMP/main.dart.bak" lib/main.dart
          rm -f test/widget_test.dart
      - name: 打补丁（SDK 版本 / 权限 / 明文流量）
        run: python3 tool/patch_platform.py

      - run: flutter pub get

      # 必须在 pub get 之后：插件这时才下载到 pub-cache，才找得到它的 build.gradle。
      # flutter_inappwebview_android 1.1.3 用了已被 AGP 移除的
      # getDefaultProguardFile('proguard-android.txt')，不修的话 release 构建
      # 做 R8 混淆时会直接失败。脚本幂等，重复执行无副作用。
      - name: 修补第三方插件（ProGuard 兼容性）
        run: python3 tool/patch_platform.py

      # 直接把生效值打进日志，构建出问题时一眼能看出是不是 SDK 版本不对
      - name: 打印生效的 SDK 配置
        run: |
          echo "--- build.gradle 关键行 ---"
          grep -nE "compileSdk|targetSdk|minSdk|ndkVersion" android/app/build.gradle || true
          echo "--- AndroidManifest 关键项 ---"
          grep -oE 'android:(usesCleartextTraffic|networkSecurityConfig|hardwareAccelerated)="[^"]*"' \
            android/app/src/main/AndroidManifest.xml || true
          echo "--- 插件 proguard 配置 ---"
          grep -rn "getDefaultProguardFile" \
            "$HOME/.pub-cache/hosted/pub.dev"/flutter_inappwebview_android-*/android/build.gradle 2>/dev/null || true

      # 日志落盘：pipefail 保证 build 的失败码不被 tee 吃掉
      - name: 构建 APK（按 ABI 拆分）
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee android-build.log
      - name: 上传 android 构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: ignore

      - name: 校验 APK 产物
        run: |
          echo "输出目录内容："
          ls -l build/app/outputs/flutter-apk/ || true
          COUNT=$(ls build/app/outputs/flutter-apk/*.apk 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::没有生成任何 APK，构建实际上失败了"
            exit 1
          fi
          echo "共生成 $COUNT 个 APK"

      # 需要上架 Play 时打开：先在 android/key.properties 与 android/app/keystore.jks
      # 配置签名，并把密钥以 secrets 传入，再启用下面两步生成 AAB。
      # - name: 构建 AAB
      #   run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: benbrowser-android
          path: build/app/outputs/flutter-apk/*.apk

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk


  # ---------------------------------------------------------------- Windows
  windows:
    name: windows
    needs: verify
    # 同上：改成 `if: false` 可跳过 Windows 构建
    if: true
    runs-on: windows-latest
    # Windows 控制台默认 cp1252，Python 打印中文日志会抛 UnicodeEncodeError
    # 让补丁脚本崩掉。脚本内部已自愈，这里再加一道环境变量保险。
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 必须先启用桌面支持，否则 flutter create --platforms=windows 与
      # flutter build windows 都会直接失败
      - name: 启用 Windows 桌面支持
        run: flutter config --enable-windows-desktop

      # flutter create 同样会覆盖 lib/main.dart 并生成模板测试，必须还原
      - name: 生成 Windows 壳
        shell: bash
        run: |
          cp lib/main.dart "$RUNNER_TEMP/main.dart.bak"
          flutter create --org com.ben --project-name ben_browser --platforms=windows .
          cp "$RUNNER_TEMP/main.dart.bak" lib/main.dart
          rm -f test/widget_test.dart
      # Windows runner 预装的是 `python`，没有 `python3` 这个别名，
      # 直接写 python3 会报 command not found。这里做一次兼容检测。
      - name: 打补丁
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 tool/patch_platform.py
          else
            python tool/patch_platform.py
          fi
      - run: flutter pub get

      # 同上：pub get 之后再跑一次，确保插件补丁也应用到 Windows 构建
      - name: 修补第三方插件
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 tool/patch_platform.py
          else
            python tool/patch_platform.py
          fi

      # 工具链诊断：MSVC / CMake / Windows SDK 缺任何一个都会让构建失败
      - name: 诊断工具链
        shell: bash
        run: flutter doctor -v

      - name: 构建 Windows 桌面版
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release 2>&1 | tee windows-build.log
      - name: 上传 windows 构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: windows-build.log
          if-no-files-found: ignore

      - name: 定位并校验构建产物
        shell: bash
        run: |
          echo "Flutter 版本："
          flutter --version

          # Flutter 各版本的输出路径不一样：新版带架构目录
          # (build/windows/x64/runner/Release)，旧版没有 (build/windows/runner/Release)。
          # 写死任何一个都可能在别的版本上失败，所以动态探测：找含 .exe 的 Release 目录。
          REL=""
          CANDIDATES="build/windows/x64/runner/Release build/windows/runner/Release"
          CANDIDATES="$CANDIDATES $(find build/windows -maxdepth 4 -type d -name Release 2>/dev/null | sort)"
          for d in $CANDIDATES; do
            [ -d "$d" ] || continue
            if ls "$d"/*.exe >/dev/null 2>&1; then REL="$d"; break; fi
          done

          if [ -z "$REL" ]; then
            echo "::error::未找到含 exe 的 Windows Release 目录"
            echo "build 目录实际内容："
            find build -maxdepth 6 -type d 2>/dev/null | head -40 || true
            echo "build 下所有 exe："
            find build -name "*.exe" 2>/dev/null | head -10 || true
            exit 1
          fi

          echo "Release 目录：$REL"
          echo "WIN_REL=$REL" >> "$GITHUB_ENV"
          ls -l "$REL"
          echo "exe 清单："
          ls "$REL"/*.exe

      - name: 打包
        shell: pwsh
        run: |
          $rel = $env:WIN_REL
          if (-not $rel) { $rel = "build/windows/x64/runner/Release" }
          # 统一成反斜杠，避免 Join-Path / Compress-Archive 在个别版本上解析异常
          $rel = $rel -replace '/', '\'
          if (-not (Test-Path $rel)) {
            Write-Error "Release 目录不存在: $rel"
            exit 1
          }
          Write-Host "打包目录: $rel"
          Get-ChildItem $rel | Select-Object Name, Length | Format-Table
          $out = "BenBrowser-windows-x64.zip"
          if (Test-Path $out) { Remove-Item $out -Force }
          Compress-Archive -Path (Join-Path $rel '*') -DestinationPath $out
          Get-Item $out | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: benbrowser-windows
          path: BenBrowser-windows-x64.zip

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BenBrowser-windows-x64.zip

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 校验
  verify:
    name: analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 建议版本稳定后锁定，例如：flutter-version: '3.35.1'
      - name: 安装依赖
        run: flutter pub get
      - name: 静态检查
        # 只分析 lib 与 test，避免各平台原生壳目录干扰结果。
        # tee 保留完整日志方便排查；pipefail 确保 analyze 的失败码不被 tee 吃掉
        run: |
          set -o pipefail
          flutter analyze lib test --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
      - name: 上传 analyze 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log
          path: analyze.log
      - name: 单元测试
        run: flutter test

  # ---------------------------------------------------------------- Android
  android:
    name: android
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      # Android 17（API 37）是硬性要求：必须装上 platforms;android-37，
      # 否则 gradle 会报 "failed to find target"。这里装不上就直接失败并
      # 给出可操作提示，而不是悄悄降级到旧版本——那样构建出来的包
      # 并不是真正的 Android 17 目标。
      - name: 安装 Android SDK 37（Android 17）
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # 旧版 sdkmanager 看不到新包，先自我更新
          "$SDKMGR" --update 2>&1 | tail -3 || true
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-37" 2>&1 | tail -5 || true
          # build-tools 版本随 API 走；装不上就让 AGP 自行准备
          "$SDKMGR" --install "build-tools;37.0.0" 2>&1 | tail -3 || true
          echo "runner 已安装的 platform："
          ls "$ANDROID_HOME/platforms"
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            echo "::error::runner 上没有 Android SDK 37，无法以 Android 17 为目标构建"
            echo "::error::临时方案：在 workflow 里设 env ANDROID_TARGET_SDK=36 先出包，等 runner 提供 37 后再切回"
            exit 1
          fi

      # flutter create 会用模板覆盖 lib/main.dart，并生成引用 MyApp 的
      # test/widget_test.dart，两者都会让打包结果变成计数器 demo，必须还原
      - name: 生成 Android 壳
        run: |
          cp lib/main.dart "$RUNNER_TEMP/main.dart.bak"
          flutter create --org com.ben --project-name ben_browser --platforms=android .
          cp "$RUNNER_TEMP/main.dart.bak" lib/main.dart
          rm -f test/widget_test.dart
      - name: 打补丁（http 明文 / 网络权限）
        run: python3 tool/patch_platform.py
      - run: flutter pub get

      - name: 构建 APK（按 ABI 拆分）
        run: flutter build apk --release --split-per-abi

      # 需要上架 Play 时打开：先在 android/key.properties 与 android/app/keystore.jks
      # 配置签名，并把密钥以 secrets 传入，再启用下面两步生成 AAB。
      # - name: 构建 AAB
      #   run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: benbrowser-android
          path: build/app/outputs/flutter-apk/*.apk

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk


  # ---------------------------------------------------------------- Windows
  windows:
    name: windows
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # flutter create 同样会覆盖 lib/main.dart 并生成模板测试，必须还原
      - name: 生成 Windows 壳
        shell: bash
        run: |
          cp lib/main.dart "$RUNNER_TEMP/main.dart.bak"
          flutter create --org com.ben --project-name ben_browser --platforms=windows .
          cp "$RUNNER_TEMP/main.dart.bak" lib/main.dart
          rm -f test/widget_test.dart
      # Windows runner 预装的是 `python`，没有 `python3` 这个别名，
      # 直接写 python3 会报 command not found。这里做一次兼容检测。
      - name: 打补丁
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 tool/patch_platform.py
          else
            python tool/patch_platform.py
          fi
      - run: flutter pub get

      - name: 构建 Windows 桌面版
        run: flutter build windows --release

      - name: 打包
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath BenBrowser-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: benbrowser-windows
          path: BenBrowser-windows-x64.zip

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BenBrowser-windows-x64.zip

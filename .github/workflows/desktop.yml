name: Build Desktop (Windows / macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  KCEF_VERBOSE: "false"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 用 Gradle Build Action：CI 會自動下載並用指定版本嘅 Gradle，
      # 完全唔需要倉庫入面有 gradle-wrapper.jar，根治 exit code 1 / 127。
      - name: Build Windows distribution
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          arguments: :desktopApp:packageMsi :desktopApp:packageExe --no-daemon --stacktrace
          # Windows 唔支援 shell 層面嘅 retry，改用 action 內置機制
          cache-read-only: false

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: windows-installer
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: warn

  build-macos:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Export JAVA_HOME
        run: echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Build macOS distribution (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 90
          max_attempts: 3
          command: gradle :desktopApp:packageDmg --no-daemon --stacktrace
        env:
          # retry action 需要 sh
          SHELL: /bin/bash

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: macos-dmg
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: warn

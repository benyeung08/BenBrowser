name: Build Desktop (Windows / macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Windows distribution
        run: .\gradlew :desktopApp:packageMsi :desktopApp:packageExe --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktopApp/build/compose/binaries/main/msi/*.msi

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build macOS distribution
        run: ./gradlew :desktopApp:packageDmg --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg

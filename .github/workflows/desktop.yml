name: Build Desktop (Windows / macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  # 全局关闭 Gradle 守护进程（CI 环境必须）
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
  # KCEF 下载超时与重试配置
  KCEF_DOWNLOAD_TIMEOUT_MS: "300000"
  KCEF_DOWNLOAD_RETRIES: "5"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle & Kotlin & KCEF
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
            ~/.kcef
            ~/.compose-kotlin-cache
          key: windows-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            windows-gradle-

      # 用 Gradle Build Action 自动注入 Gradle，不依赖仓库内的 gradlew
      - name: Build Windows distribution
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          arguments: :desktopApp:packageMsi --no-daemon --stacktrace --info
        env:
          # 避免 jpackage 找不到 WiX 工具链
          JPACKAGE_DEBUG: "true"

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: windows-installer
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: warn

  build-macos:
    runs-on: macos-14
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Export JAVA_HOME
        run: echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Cache Gradle & Kotlin & KCEF
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
            ~/.kcef
            ~/.compose-kotlin-cache
          key: macos-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            macos-gradle-

      # macOS 首次构建 KCEF 需要下载 Chromium（几百 MB），允许重试
      - name: Build macOS distribution (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 120
          max_attempts: 3
          command: gradle :desktopApp:packageDmg --no-daemon --stacktrace --info
        env:
          SHELL: /bin/bash

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: macos-dmg
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: warn

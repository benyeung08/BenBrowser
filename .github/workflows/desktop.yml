name: Build Desktop (Windows / macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  # 关闭 KCEF 进度动画，避免 CI 日志被刷屏导致 job 被判定为卡死
  KCEF_VERBOSE: "false"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Gradle 与 KCEF 运行时缓存，二次构建显著提速
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Windows distribution (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          command: .\gradlew :desktopApp:packageMsi :desktopApp:packageExe --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: windows-installer
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: warn

  build-macos:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # macOS 上 setup-java 偶尔不注入 PATH，手动导出
      - name: Export JAVA_HOME
        run: echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - uses: gradle/actions/setup-gradle@v4

      - name: Build macOS distribution (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 90
          max_attempts: 3
          command: ./gradlew :desktopApp:packageDmg --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: macos-dmg
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: warn

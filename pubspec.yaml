name: ben_browser
description: >-
  基于 Flutter + 系统 WebView 的轻量自研浏览器，面向 Android。
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  # 3.38 是「Android 16 支持」的门槛：
  # - flutter.compileSdkVersion / targetSdkVersion 首次同时为 36
  # - 默认 NDK 升到 r28，这是 16KB 内存分页对齐的最低要求
  # 更低的版本打不出符合 Android 16 的包。
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1

  # WebView 内核（Android: 系统 WebView / Windows: WebView2 / macOS: WKWebView）
  flutter_inappwebview: ^6.1.0

  # 本地存储（设置 / 书签 / 历史，桌面端与移动端均有实现）
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4

  # 下载
  dio: ^5.7.0
  open_filex: ^4.5.0

  # 外链跳转
  url_launcher: ^6.3.1

  # 版本信息（设置页展示版本号 / 检查更新时比对）
  package_info_plus: ^8.1.0

  # 解压更新包（桌面端下载 zip 后在应用内展开）
  archive: ^3.6.1

  # 路径处理
  path: ^1.9.0

  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

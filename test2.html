<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港巴士實時 ETA 及詳細時間表系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col text-slate-800">

    <main class="flex-grow max-w-6xl w-full mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- 左側控制面板 -->
        <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 h-fit">
            <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-2">
                <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-blue-500"></i> 路線篩選
                </h2>
                <span class="text-xs font-mono bg-slate-900 text-white px-2.5 py-1 rounded-md border border-slate-800" id="live-clock">00:00:00</span>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">巴士公司</label>
                    <select id="company-select" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none font-medium transition">
                        <option value="KMB">九巴 KMB</option>
                        <option value="CTB">城巴 CTB</option>
                        <option value="LWB">龍運 LWB</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">輸入路線</label>
                    <div class="relative">
                        <input type="text" id="route-input" value="1A" placeholder="例如: 1A, 720, E33" class="w-full p-2.5 pl-3 pr-10 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase font-bold tracking-wide transition">
                        <button id="search-btn" class="absolute right-2 top-2 w-8 h-8 rounded-lg bg-blue-500 hover:bg-blue-600 text-white flex items-center justify-center transition shadow-sm">
                            <i id="search-icon" class="fa-solid fa-magnifying-glass text-sm"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">行車方向</label>
                    <div class="grid grid-cols-1 gap-2" id="direction-container">
                        <button id="dir-outbound" data-dir="outbound" class="dir-btn py-2.5 px-3 bg-blue-600 text-white text-sm rounded-xl font-medium shadow-sm transition text-left flex justify-between items-center">
                            <span>去程</span> <i class="fa-solid fa-circle-chevron-right text-xs opacity-70"></i>
                        </button>
                        <button id="dir-inbound" data-dir="inbound" class="dir-btn py-2.5 px-3 bg-slate-100 text-slate-600 text-sm rounded-xl font-medium hover:bg-slate-200 transition text-left flex justify-between items-center">
                            <span>回程</span> <i class="fa-solid fa-circle-chevron-right text-xs opacity-30"></i>
                        </button>
                    </div>
                </div>

                <div class="text-center pt-2">
                    <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-50 text-emerald-700 text-xs font-medium border border-emerald-100 w-full justify-center shadow-inner">
                        <i id="refresh-icon" class="fa-solid fa-sync animate-spin text-[10px]"></i> <span id="refresh-text">實時數據每 10 秒自動刷新</span>
                    </span>
                </div>
            </div>
        </section>

        <!-- 右側資料顯示面板 -->
        <section class="md:col-span-2 flex flex-col gap-4">
            
            <div id="route-banner" class="bg-gradient-to-r from-red-600 to-red-700 text-white p-5 rounded-2xl shadow-sm flex justify-between items-center transition-all duration-300">
                <div>
                    <div class="flex items-center gap-3">
                        <span class="text-3xl font-black bg-white text-red-600 px-3 py-0.5 rounded-xl shadow-sm" id="info-route">1A</span>
                        <h3 class="text-lg font-bold tracking-wide" id="info-direction">載入中...</h3>
                    </div>
                    <p class="text-xs opacity-80 mt-2 flex items-center gap-1"><i class="fa-solid fa-circle-info"></i> 結合政府開放 API 與常規班次時間表</p>
                </div>
                <span class="bg-white/20 text-xs font-bold px-3 py-1.5 rounded-full backdrop-blur-sm shadow-inner uppercase tracking-wider" id="company-badge">九巴 KMB</span>
            </div>

            <div class="flex bg-slate-200 p-1 rounded-xl">
                <button id="tab-btn-eta" class="flex-1 py-2.5 text-sm font-bold rounded-lg transition bg-white text-blue-600 shadow-sm flex justify-center items-center gap-2">
                    <i class="fa-solid fa-stopwatch"></i> 實時到站時間 (ETA)
                </button>
                <button id="tab-btn-timetable" class="flex-1 py-2.5 text-sm font-medium rounded-lg transition text-slate-600 hover:text-slate-900 flex justify-center items-center gap-2">
                    <i class="fa-solid fa-calendar-days"></i> 班次時間表 (Timetable)
                </button>
            </div>

            <!-- ETA 面板 -->
            <div id="panel-eta" class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex-grow flex flex-col min-h-[50vh]">
                <div class="bg-slate-50 px-4 py-3 border-b border-slate-100 text-xs font-bold text-slate-400 uppercase tracking-wider grid grid-cols-12">
                    <div class="col-span-1 text-center">#</div>
                    <div class="col-span-6">巴士分站名稱</div>
                    <div class="col-span-5 text-right">預計到站時間 / 班次時刻</div>
                </div>
                <div id="stops-container" class="divide-y divide-slate-100 max-h-[55vh] overflow-y-auto flex-grow">
                    <!-- 到站資料 -->
                </div>
            </div>

            <!-- 時間表面板 -->
            <div id="panel-timetable" class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex-grow hidden p-5">
                <div id="timetable-container" class="space-y-6 max-h-[55vh] overflow-y-auto pr-1">
                    <!-- 靜態時間表 -->
                </div>
            </div>

        </section>
    </main>

    <script>
        const staticTimetables = {
            "KMB": {
                "1A": {
                    "outbound": [
                        { day: "星期一至五 (Mon - Fri)", periods: [{ t: "05:30 - 06:30", f: "10 - 12 分鐘" }, { t: "06:30 - 09:00", f: "4 - 7 分鐘" }, { t: "09:00 - 17:00", f: "7 - 10 分鐘" }, { t: "17:00 - 19:30", f: "5 - 8 分鐘" }, { t: "19:30 - 00:15", f: "10 - 15 分鐘" }] },
                        { day: "星期六 (Saturdays)", periods: [{ t: "05:30 - 07:30", f: "10 - 12 分鐘" }, { t: "07:30 - 23:00", f: "6 - 10 分鐘" }, { t: "23:00 - 00:15", f: "12 - 15 分鐘" }] },
                        { day: "星期日及公眾假期 (Suns & Public Holidays)", periods: [{ t: "05:30 - 08:30", f: "12 - 15 分鐘" }, { t: "08:30 - 23:00", f: "7 - 12 分鐘" }, { t: "23:00 - 00:15", f: "15 分鐘" }] }
                    ],
                    "inbound": [
                        { day: "星期一至五 (Mon - Fri)", periods: [{ t: "05:40 - 07:00", f: "10 - 12 分鐘" }, { t: "07:00 - 09:30", f: "5 - 8 分鐘" }, { t: "09:30 - 17:30", f: "8 - 12 分鐘" }, { t: "17:30 - 20:00", f: "6 - 9 分鐘" }, { t: "20:00 - 00:30", f: "11 - 15 分鐘" }] },
                        { day: "星期六、日及公眾假期 (Ends & Holidays)", periods: [{ t: "05:40 - 08:00", f: "12 - 15 分鐘" }, { t: "08:00 - 23:00", f: "8 - 12 分鐘" }, { t: "23:00 - 00:30", f: "15 分鐘" }] }
                    ]
                }
            },
            "CTB": {
                "720": {
                    "outbound": [
                        { day: "星期一至五 (Mon - Fri)", periods: [{ t: "05:50 - 07:00", f: "12 - 15 分鐘" }, { t: "07:00 - 09:00", f: "4 - 8 分鐘" }, { t: "09:00 - 16:30", f: "10 - 15 分鐘" }, { t: "16:30 - 19:00", f: "6 - 10 分鐘" }, { t: "19:00 - 00:00", f: "15 - 20 分鐘" }] },
                        { day: "星期六、日及公眾假期 (Weeks & Holidays)", periods: [{ t: "05:50 - 09:00", f: "15 分鐘" }, { t: "09:00 - 21:00", f: "10 - 12 分鐘" }, { t: "21:00 - 00:00", f: "15 - 20 分鐘" }] }
                    ],
                    "inbound": [
                        { day: "星期一至五 (Mon - Fri)", periods: [{ t: "06:15 - 07:30", f: "12 - 15 分鐘" }, { t: "07:30 - 09:30", f: "6 - 10 分鐘" }, { t: "09:30 - 17:30", f: "12 - 15 分鐘" }, { t: "17:30 - 20:00", f: "5 - 9 分鐘" }, { t: "20:00 - 00:30", f: "15 - 20 分鐘" }] },
                        { day: "星期六、日及公眾假期 (Weeks & Holidays)", periods: [{ t: "06:15 - 00:30", f: "12 - 15 分鐘" }] }
                    ]
                }
            },
            "LWB": {
                "E33": {
                    "outbound": [
                        { day: "每日營運 (Daily)", periods: [{ t: "05:20 - 06:30", f: "15 - 20 分鐘" }, { t: "06:30 - 08:30", f: "10 - 12 分鐘" }, { t: "08:30 - 22:00", f: "12 - 15 分鐘" }, { t: "22:00 - 00:00", f: "20 分鐘" }] }
                    ],
                    "inbound": [
                        { day: "每日營運 (Daily)", periods: [{ t: "05:30 - 07:30", f: "20 分鐘" }, { t: "07:30 - 17:30", f: "12 - 15 分鐘" }, { t: "17:30 - 19:30", f: "8 - 12 分鐘" }, { t: "19:30 - 00:00", f: "15 - 20 分鐘" }] }
                    ]
                }
            }
        };

        const stopNameCache = new Map();
        let currentCompany = "KMB"; 
        let currentRoute = "1A";
        let currentDirection = "outbound"; 
        let currentTab = "eta"; 
        let activeRouteData = null;
        let autoRefreshTimer = null; 
        let isFetching = false; 

        const brandStyles = {
            KMB: { bg: "from-red-600 to-red-700", text: "text-red-600", label: "九巴 KMB" },
            CTB: { bg: "from-amber-400 to-amber-500 text-slate-900", text: "text-amber-500", label: "城巴 CTB" },
            LWB: { bg: "from-orange-500 to-orange-600", text: "text-orange-600", label: "龍運 LWB" }
        };

        const companySelect = document.getElementById('company-select');
        const routeInput = document.getElementById('route-input');
        const searchBtn = document.getElementById('search-btn');
        const dirOutbound = document.getElementById('dir-outbound');
        const dirInbound = document.getElementById('dir-inbound');
        const infoRoute = document.getElementById('info-route');
        const infoDirection = document.getElementById('info-direction');
        const companyBadge = document.getElementById('company-badge');
        const routeBanner = document.getElementById('route-banner');
        const stopsContainer = document.getElementById('stops-container');
        const timetableContainer = document.getElementById('timetable-container');

        const tabBtnEta = document.getElementById('tab-btn-eta');
        const tabBtnTimetable = document.getElementById('tab-btn-timetable');
        const panelEta = document.getElementById('panel-eta');
        const panelTimetable = document.getElementById('panel-timetable');

        function init() {
            setInterval(updateClock, 1000);
            updateClock();

            companySelect.addEventListener('change', (e) => {
                currentCompany = e.target.value;
                routeInput.value = currentCompany === "KMB" ? "1A" : currentCompany === "CTB" ? "720" : "E33";
            });

            searchBtn.addEventListener('click', loadBusData);
            routeInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') loadBusData(); });
            
            document.querySelectorAll('.dir-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const targetBtn = e.target.closest('.dir-btn');
                    currentDirection = targetBtn.dataset.dir;
                    updateDirectionButtons();
                    renderTabsContent();
                    resetAutoRefresh(); 
                });
            });

            tabBtnEta.addEventListener('click', () => switchTab('eta'));
            tabBtnTimetable.addEventListener('click', () => switchTab('timetable'));

            loadBusData();
            startAutoRefresh(); 
        }

        function startAutoRefresh() {
            autoRefreshTimer = setInterval(() => {
                if (!isFetching && currentTab === "eta" && activeRouteData) {
                    console.log("自動定時刷新 ETA...");
                    renderEtaList(true); // 傳入 true 代表是背景自動刷新，不破壞滾動條結構
                }
            }, 10000);
        }

        function resetAutoRefresh() {
            clearInterval(autoRefreshTimer);
            startAutoRefresh();
        }

        async function loadBusData() {
            currentRoute = routeInput.value.trim().toUpperCase();
            if (!currentRoute) return alert("請輸入路線編號！");

            showLoading(true);
            updateBannerStyle();

            try {
                if (currentCompany === "KMB" || currentCompany === "LWB") {
                    activeRouteData = await fetchKmbRouteStops(currentRoute, currentCompany);
                } else if (currentCompany === "CTB") {
                    activeRouteData = await fetchCtbRouteStops(currentRoute);
                }

                if (!activeRouteData || (activeRouteData.outbound.length === 0 && activeRouteData.inbound.length === 0)) {
                    throw new Error("找不到該路線資料，請檢查公司與編號。");
                }

                updateDirectionLabels();
                updateDirectionButtons();
                await renderTabsContent();
                resetAutoRefresh(); 

            } catch (err) {
                stopsContainer.innerHTML = `<div class="text-center py-12 text-slate-400"><i class="fa-solid fa-circle-exclamation text-2xl text-amber-500 mb-1"></i><p>${err.message}</p></div>`;
                timetableContainer.innerHTML = `<div class="text-center py-12 text-slate-400">無法加載時間表</div>`;
                infoDirection.textContent = "查無此路線";
            } finally {
                showLoading(false);
            }
        }

        async function renderTabsContent() {
            if (currentTab === "eta") {
                await renderEtaList(false);
            } else {
                renderTimetable();
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            if (tab === 'eta') {
                tabBtnEta.className = "flex-1 py-2.5 text-sm font-bold rounded-lg transition bg-white text-blue-600 shadow-sm flex justify-center items-center gap-2";
                tabBtnTimetable.className = "flex-1 py-2.5 text-sm font-medium rounded-lg transition text-slate-600 hover:text-slate-900 flex justify-center items-center gap-2";
                panelEta.classList.remove('hidden');
                panelTimetable.classList.add('hidden');
                renderEtaList(false);
                resetAutoRefresh(); 
            } else {
                tabBtnTimetable.className = "flex-1 py-2.5 text-sm font-bold rounded-lg transition bg-white text-blue-600 shadow-sm flex justify-center items-center gap-2";
                tabBtnEta.className = "flex-1 py-2.5 text-sm font-medium rounded-lg transition text-slate-600 hover:text-slate-900 flex justify-center items-center gap-2";
                panelTimetable.classList.remove('hidden');
                panelEta.classList.add('hidden');
                renderTimetable();
                clearInterval(autoRefreshTimer); 
            }
        }

        function renderTimetable() {
            timetableContainer.innerHTML = "";
            let routeTimetable = null;
            if (staticTimetables[currentCompany] && staticTimetables[currentCompany][currentRoute]) {
                routeTimetable = staticTimetables[currentCompany][currentRoute][currentDirection];
            }

            if (!routeTimetable) {
                routeTimetable = [
                    { day: "星期一至五 (Mondays to Fridays)", periods: [{ t: "06:00 - 07:00", f: "12 - 15 分鐘" }, { t: "07:00 - 09:00", f: "6 - 10 分鐘" }, { t: "09:00 - 17:00", f: "10 - 15 分鐘" }, { t: "17:00 - 19:30", f: "7 - 12 分鐘" }, { t: "19:30 - 23:30", f: "15 - 20 分鐘" }] },
                    { day: "星期六、日及公眾假期 (Saturdays, Sundays & Holidays)", periods: [{ t: "06:00 - 10:00", f: "15 - 20 分鐘" }, { t: "10:00 - 21:00", f: "10 - 15 分鐘" }, { t: "21:00 - 23:30", f: "15 - 20 分鐘" }] }
                ];
            }

            routeTimetable.forEach(group => {
                const card = document.createElement('div');
                card.className = "border border-slate-100 rounded-xl overflow-hidden shadow-sm";
                
                let rowsHTML = "";
                group.periods.forEach(p => {
                    rowsHTML += `
                    <div class="grid grid-cols-2 px-4 py-2.5 text-sm border-b border-slate-50 last:border-none hover:bg-slate-50">
                        <div class="font-mono text-slate-600 flex items-center gap-2"><i class="fa-regular fa-clock text-xs text-slate-400"></i> ${p.t}</div>
                        <div class="text-right font-bold text-blue-600">${p.f}</div>
                    </div>
                    `;
                });

                card.innerHTML = `
                <div class="bg-slate-100 px-4 py-2 text-xs font-bold text-slate-700 flex items-center gap-2 border-b border-slate-200">
                    <i class="fa-solid fa-calendar-day text-blue-500"></i> ${group.day}
                </div>
                <div class="divide-y divide-slate-100 bg-white">
                    ${rowsHTML}
                </div>
                `;
                timetableContainer.appendChild(card);
            });
        }

        async function renderEtaList(isBackgroundRefresh = false) {
            if (!activeRouteData) return;
            if (!isBackgroundRefresh) showLoading(true);

            const stops = activeRouteData[currentDirection];
            if (stops.length === 0) {
                stopsContainer.innerHTML = `<div class="text-center py-12 text-slate-400">此方向暫無營運班次。</div>`;
                if (!isBackgroundRefresh) showLoading(false);
                return;
            }

            // 調整自動刷新 Icon 的動畫效果
            const refreshIcon = document.getElementById('refresh-icon');
            if (refreshIcon) refreshIcon.classList.add('animate-spin');

            try {
                const promises = stops.map(async (stopObj) => {
                    const stopId = stopObj.stop;
                    const seq = stopObj.seq;
                    
                    const namePromise = (currentCompany === "CTB") ? getCtbStopName(stopId) : getKmbStopName(stopId, currentCompany);
                    const etaPromise = fetchLiveETA(currentCompany, stopId, currentRoute, seq);

                    const [name, etaList] = await Promise.all([namePromise, etaPromise]);
                    return { seq, name, etaList };
                });

                const renderData = await Promise.all(promises);

                if (renderData.length > 0) {
                    const destName = renderData[renderData.length - 1].name;
                    infoDirection.textContent = `往 ${destName}`;
                }

                stopsContainer.innerHTML = "";

                renderData.forEach(item => {
                    const row = document.createElement('div');
                    row.className = "grid grid-cols-12 px-4 py-3.5 items-center hover:bg-slate-50 transition";
                    
                    let etaHTML = `<span class="text-xs text-slate-400">暫無班次數據</span>`;
                    
                    if (item.etaList && item.etaList.length > 0) {
                        etaHTML = item.etaList.map((etaObj, index) => {
                            if (!etaObj.eta) return "";
                            const mins = calculateMinutesLeft(etaObj.eta);
                            const timeStr = formatTimeToHM(etaObj.eta);
                            const rmk = etaObj.rmk_tc ? ` <span class="text-[10px] bg-slate-100 text-slate-500 px-1 py-0.5 rounded font-normal">${etaObj.rmk_tc}</span>` : '';
                            
                            if (index === 0) {
                                let minsHTML = mins <= 1 
                                    ? `<span class="text-sm font-bold text-red-500 animate-pulse">即將到站</span>`
                                    : `<span class="text-xl font-black text-emerald-600">${mins}</span> <span class="text-xs text-slate-400 font-medium">分鐘</span>`;
                                
                                return `
                                <div class="mb-1">
                                    <div>${minsHTML}${rmk}</div>
                                    <div class="text-[11px] text-slate-400 font-mono tracking-wide mt-0.5"><i class="fa-regular fa-clock text-[10px] mr-0.5"></i>預計 ${timeStr}</div>
                                </div>`;
                            } else {
                                return `
                                <div class="inline-flex flex-col items-end text-right">
                                    <span class="text-xs text-slate-600 font-bold">${mins}分</span>
                                    <span class="text-[10px] text-slate-400 font-mono">${timeStr}</span>
                                </div>`;
                            }
                        }).filter(html => html !== "").join('<span class="text-slate-300 mx-2 text-xs self-center">|</span>');

                        if (!etaHTML) etaHTML = `<span class="text-xs text-slate-400">暫無班次數據</span>`;
                    }

                    row.innerHTML = `
                    <div class="col-span-1 text-center text-xs font-mono font-bold text-slate-400">
                        <span class="inline-block w-5 h-5 rounded-full bg-slate-100 leading-5">${item.seq}</span>
                    </div>
                    <div class="col-span-6 pr-2">
                        <p class="font-bold text-slate-800 text-sm md:text-base tracking-wide">${item.name}</p>
                    </div>
                    <div class="col-span-5 text-right flex justify-end items-center gap-1">
                        <div class="flex items-center justify-end">${etaHTML}</div>
                    </div>
                    `;
                    stopsContainer.appendChild(row);
                });
            } catch (e) {
                console.error("更新 ETA 失敗: ", e);
            } finally {
                if (!isBackgroundRefresh) showLoading(false);
                setTimeout(() => {
                    if (refreshIcon) refreshIcon.classList.remove('animate-spin');
                }, 800);
            }
        }

        function formatTimeToHM(isoString) {
            if (!isoString) return "--:--";
            const date = new Date(isoString);
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        async function fetchKmbRouteStops(route, company) {
            const compLower = company.toLowerCase(); // kmb 或 lwb
            const outboundRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/outbound/1`);
            const inboundRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/inbound/1`);
            const outData = (await outboundRes.json()).data || [];
            const inData = (await inboundRes.json()).data || [];
            
            // 篩選對應公司的資料 (九巴及龍運有時共用 API 端點，需過濾)
            return { 
                outbound: outData.filter(d => d.co.toLowerCase() === compLower), 
                inbound: inData.filter(d => d.co.toLowerCase() === compLower) 
            };
        }

        async function getKmbStopName(stopId, company) {
            if (stopNameCache.has(stopId)) return stopNameCache.get(stopId);
            try {
                const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${stopId}`);
                const name = (await res.json()).data.name_tc;
                stopNameCache.set(stopId, name);
                return name;
            } catch { return "未知車站"; }
        }

        async function fetchCtbRouteStops(route) {
            const outboundRes = await fetch(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/route-stop/CTB/${route}/outbound`);
            const inboundRes = await fetch(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/route-stop/CTB/${route}/inbound`);
            return { outbound: (await outboundRes.json()).data || [], inbound: (await inboundRes.json()).data || [] };
        }

        async function getCtbStopName(stopId) {
            if (stopNameCache.has(stopId)) return stopNameCache.get(stopId);
            try {
                const res = await fetch(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/stop/${stopId}`);
                const name = (await res.json()).data.name_tc;
                stopNameCache.set(stopId, name);
                return name;
            } catch { return "未知車站"; }
        }

        async function fetchLiveETA(company, stopId, route, seq) {
            try {
                let url = "";
                if (company === "KMB" || company === "LWB") {
                    url = `https://data.etabus.gov.hk/v1/transport/kmb/eta/${stopId}/${route}/1`;
                } else if (company === "CTB") {
                    url = `https://rt.data.gov.hk/v1/transport/citybus-nwfb/eta/CTB/${stopId}/${route}`;
                }
                
                const res = await fetch(url);
                const data = await res.json();
                
                // 核心修正：KMB/LWB API 返回的去回程欄位通常為大寫縮寫 "O" 與 "I"
                const currentDirToken = currentDirection === "outbound" ? "O" : "I";
                
                return (data.data || []).filter(item => {
                    const itemDir = item.dir ? item.dir.toUpperCase() : "";
                    const targetDirToken = currentDirection === "outbound" ? "OUTBOUND" : "INBOUND";
                    
                    // 比對方向代碼 (OUTBOUND / O 或 INBOUND / I) 並且匹配分站序號 (seq)
                    return (itemDir === targetDirToken || itemDir === currentDirToken) && 
                           (!item.seq || parseInt(item.seq) === parseInt(seq));
                }).slice(0, 3);
            } catch (e) { 
                console.error("獲取即時 ETA 出錯:", e);
                return []; 
            }
        }

        function calculateMinutesLeft(etaTimestamp) {
            if (!etaTimestamp) return 0;
            const diffMins = Math.ceil((new Date(etaTimestamp) - new Date()) / 1000 / 60);
            return diffMins < 0 ? 0 : diffMins;
        }

        function updateBannerStyle() {
            const style = brandStyles[currentCompany];
            infoRoute.textContent = currentRoute;
            companyBadge.textContent = style.label;
            routeBanner.className = `text-white p-5 rounded-2xl shadow-sm flex justify-between items-center transition-all duration-300 bg-gradient-to-r ${style.bg}`;
            infoRoute.className = `text-3xl font-black bg-white px-3 py-0.5 rounded-xl shadow-sm ${style.text}`;
        }

        function updateDirectionLabels() {
            dirOutbound.querySelector('span').textContent = activeRouteData.outbound.length > 0 ? `去程 (共 ${activeRouteData.outbound.length} 站)` : "去程 (無服務)";
            dirInbound.querySelector('span').textContent = activeRouteData.inbound.length > 0 ? `回程 (共 ${activeRouteData.inbound.length} 站)` : "回程 (無服務)";
        }

        function updateDirectionButtons() {
            document.querySelectorAll('.dir-btn').forEach(btn => {
                if (btn.dataset.dir === currentDirection) {
                    btn.className = "dir-btn py-2.5 px-3 bg-blue-600 text-white text-sm rounded-xl font-medium shadow-md transition text-left flex justify-between items-center w-full cursor-pointer";
                    btn.querySelector('i').className = "fa-solid fa-circle-chevron-right text-xs opacity-100";
                } else {
                    btn.className = "dir-btn py-2.5 px-3 bg-slate-100 text-slate-600 text-sm rounded-xl font-medium hover:bg-slate-200 transition text-left flex justify-between items-center w-full cursor-pointer";
                    btn.querySelector('i').className = "fa-solid fa-circle-chevron-right text-xs opacity-30";
                }
            });
        }

        function showLoading(isLoading) {
            isFetching = isLoading; 
            const searchIcon = document.getElementById('search-icon');
            if (isLoading) {
                if(searchIcon) searchIcon.className = "fa-solid fa-spinner animate-spin text-sm";
                stopsContainer.innerHTML = `<div class="text-center py-12 text-slate-400"><i class="fa-solid fa-circle-notch animate-spin text-3xl text-blue-500 mb-3"></i><p>正在實時查詢全線巴士站及 ETA 數據...</p></div>`;
            } else {
                if(searchIcon) searchIcon.className = "fa-solid fa-magnifying-glass text-sm";
            }
        }

        function updateClock() {
            document.getElementById('live-clock').innerHTML = `<i class="fa-regular fa-clock text-amber-400 mr-1.5"></i>${new Date().toLocaleTimeString()}`;
        }

        window.onload = init;
    </script>
</body>
</html>
